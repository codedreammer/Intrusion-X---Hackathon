<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect with Friends - Log In</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .title { color: #1877f2; font-size: 48px; font-weight: bold; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #1877f2; color: white; border: none; border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        button:hover { background: #166fe5; }
        a { color: #1877f2; text-decoration: none; font-size: 14px; }
        a:hover { text-decoration: underline; }
        .divider { border-bottom: 1px solid #dadde1; margin: 20px 0; }
        .create-btn { background: #42b72a; width: auto; padding: 12px 20px; font-size: 16px; margin: 0 auto; display: inline-block; }
        .create-btn:hover { background: #36a420; }
    </style>
</head>
<body>
    <div class="title">SocialNet</div>
    <div class="box">
        <form>
            <input type="text" placeholder="Email address or phone number" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <a href="#">Forgotten password?</a>
        <div class="divider"></div>
        <button type="button" class="create-btn">Create New Account</button>
    </div>
</body>
</html>
